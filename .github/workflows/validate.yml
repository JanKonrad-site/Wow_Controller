name: Validate Vanilla addon

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y lua5.1 libxml2-utils

      - name: Check Lua syntax
        run: luac5.1 -p Cleanup.lua Core.lua

      - name: Test native runtime and legacy cleanup
        run: lua5.1 tests/minimal_runtime_harness.lua

      - name: Check cleanup-only bindings XML
        run: |
          xmllint --noout Bindings.xml
          test "$(grep -c 'OctoPort_LegacyNoop()' Bindings.xml)" -eq 22
          ! grep -E '(ActionButton|UseAction|Target|MoveForward|MoveBackward|Strafe|TurnOrAction)' Bindings.xml

      - name: Check inert runtime
        run: |
          ! grep -En '^[[:space:]]*(SetBinding|SaveBindings)\(' Core.lua
          ! grep -REn '(UseAction|ActionButtonDown|ActionButtonUp|TargetNearest|MoveForward|MoveBackward|StrafeLeft|StrafeRight|TurnOrAction|Jump|ToggleAutoRun)\(' --include='*.lua' Cleanup.lua Core.lua
          ! grep -REn '(CreateTexture|CreateFontString|UIPanelButtonTemplate|Minimap|WorldMap|QuestFrame)' --include='*.lua' Cleanup.lua Core.lua
          test "$(grep -Ec 'CreateFrame\(' Core.lua)" -eq 1
          test "$(grep -Ec 'CreateFrame\(' Cleanup.lua)" -eq 0
          grep -q 'basicMigrationVersion' Cleanup.lua
          grep -q 'bindingRecoverySnapshot' Cleanup.lua
          grep -q 'PLAYER_REGEN_ENABLED' Core.lua

      - name: Check OctoLauncher layout
        run: |
          test -f Wow_Controller.toc
          grep -q '^## Version: 1.0.0$' Wow_Controller.toc
          grep -q '^Cleanup.lua$' Wow_Controller.toc
          grep -q '^Core.lua$' Wow_Controller.toc
          ! grep -Eq '^(Bindings|UI|Menu|Radial|Quest|Loot)\.lua$' Wow_Controller.toc
          while IFS= read -r file; do
            case "$file" in
              ""|'##'*) continue ;;
            esac
            test -f "$file" || { echo "Missing TOC file: $file"; exit 1; }
          done < Wow_Controller.toc
