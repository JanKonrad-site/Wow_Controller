name: Validate Vanilla addon

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y lua5.1 libxml2-utils

      - name: Check Lua syntax
        run: luac5.1 -p Core.lua Bindings.lua UI.lua Reticle.lua Radial.lua Quest.lua Loot.lua Menu.lua

      - name: Test binding recovery and session restore
        run: lua5.1 tests/safety_harness.lua

      - name: Check bindings XML
        run: xmllint --noout Bindings.xml

      - name: Check safety invariants
        run: |
          test "$(grep -Ec '^[[:space:]]*SaveBindings\(' Bindings.lua)" -eq 1
          grep -q 'function OctoPort:RecoverLegacyBindings' Bindings.lua
          grep -q 'RegisterEvent("PLAYER_LOGOUT")' Core.lua
          ! grep -REn 'ActionButton_GetPagedID[[:space:]]*=' --include='*.lua' .
          ! grep -REn 'UIParent_ManageFramePositions[[:space:]]*=' --include='*.lua' .
          ! grep -REn 'SetParent\(' UI.lua
          grep -q 'OCTOPORT_MOVE_FORWARD' Bindings.xml
          grep -q 'function OctoPort_Move' Bindings.lua

      - name: Check OctoLauncher layout
        run: |
          test -f Wow_Controller.toc
          while IFS= read -r file; do
            case "$file" in
              ""|'##'*) continue ;;
            esac
            test -f "$file" || { echo "Missing TOC file: $file"; exit 1; }
          done < Wow_Controller.toc
